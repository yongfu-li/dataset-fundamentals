- type: bullets
  title: The Law of Data Quality Cascades
  bullets:
  - Production machine learning systems execute multi-stage directed processing graphs
  - The law of data quality cascades establishes that early collection errors compound
  - Hardware telemetry drift or missing sensor readings compound through arbitrary
    imputation
  - Noisy annotations mislead feature representation learning and model optimization
  - Even subtle collection artifacts can trigger catastrophic failure during production
  notes: Production machine learning systems execute multi-stage directed processing
    graphs. The law of data quality cascades establishes that early collection errors
    compound non-linearly across downstream stages. Hardware telemetry drift or missing
    sensor readings compound through arbitrary imputation. Noisy annotations mislead
    feature representation learning and model optimization. Even subtle collection
    artifacts can trigger catastrophic failure during production deployment.
- type: bullets
  title: 'Comic: The Perilous Journey of Record 402'
  bullets:
  - Here we visualize the law of data quality cascades through an illustrated four-panel
    comic
  - In panel one
  - In panel two
  - In panel three, an exhausted crowd worker mislabels the corrupted record
  - By panel four
  notes: Here we visualize the law of data quality cascades through an illustrated
    four-panel comic strip. In panel one, an uncalibrated bedside sensor introduces
    a minor twenty-five millisecond desync. In panel two, an engineer naively plugs
    missing blood pressure with a default negative nine-nine-nine sentinel value.
    In panel three, an exhausted crowd worker mislabels the corrupted record. By panel
    four, the downstream machine learning model overfits to the artifact, triggering
    catastrophic triage failures in the clinical ICU.
- type: bullets
  title: 'Real-World Case Studies: When Datasets Fail'
  bullets:
  - Catastrophic consequences of data quality cascades appear across high-stakes industries
  - In clinical ICU sepsis prediction
  - In autonomous driving pipelines
  - Such temporal misalignment creates ghost obstacles and emergency braking failures
    in road
  notes: Catastrophic consequences of data quality cascades appear across high-stakes
    industries. In clinical ICU sepsis prediction, models collapsed when deployed
    across new hospitals due to nurse logging frequency artifacts. In autonomous driving
    pipelines, twenty milliseconds of LiDAR and camera timing jitter produces over
    half a meter of spatial displacement. Such temporal misalignment creates ghost
    obstacles and emergency braking failures in road tests.
