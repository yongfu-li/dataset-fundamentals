  - Total bytes transferred drops by an order of magnitude for analytical workloads
  notes: Analytical input-output efficiency can be modeled mathematically. For a table
    of N records and M columns, an uncompressed row store must read all column byte
    widths for every query. A columnar architecture executes projection pushdown,
    reading only requested column subsets. Columnar compression ratios further shrink
    physical disk footprint by exploiting type homogeneity. Total bytes transferred
    drops by an order of magnitude for analytical workloads.
- type: bullets
  title: 'Advanced Columnar Encoding: Dictionary and RLE'
  bullets:
  - Columnar engines achieve high compression ratios through specialized entropy encoding
  - Categorical features with low cardinality replace repetitive strings with compact
    integer
  - Run-length encoding compresses consecutive identical values into compact value
    and count
  - Combining dictionary mapping with run-length encoding dramatically reduces memory
  notes: Columnar engines achieve high compression ratios through specialized entropy
    encoding schemes. Categorical features with low cardinality replace repetitive
    strings with compact integer tokens. Run-length encoding compresses consecutive
    identical values into compact value and count pairs. Combining dictionary mapping
    with run-length encoding dramatically reduces memory footprint while preserving
    direct random access.
- type: bullets
  title: Predicate Pushdown and Row Group Metadata Skipping
  bullets:
  - Apache Parquet organizes large datasets into self-contained row groups
  - Each row group header maintains embedded metadata storing exact minimum, maximum
  - When executing filtered queries
  - If a query filter falls outside the row group minimum and maximum range
  notes: Apache Parquet organizes large datasets into self-contained row groups. Each
    row group header maintains embedded metadata storing exact minimum, maximum, and
    null counts for every column. When executing filtered queries, query engines inspect
    row group metadata before loading data. If a query filter falls outside the row
    group minimum and maximum range, the engine skips the entire row group from disk.
