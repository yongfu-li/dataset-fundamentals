  notes: Example 1.8 demonstrates relational tabular data managed by a relational
    SQL engine. Relational database management systems enforce strong column typing,
    unique primary keys, and foreign key integrity. Structured query language allows
    analysts to perform declarative filtering, joins, and aggregations across related
    tables. You can inspect the table schemas and execute analytical queries in the
    example 8 module.
- type: code
  title: Example 1.8 — listing
  code: "]\nCREATE TABLE Customers (\n    customer_id SERIAL PRIMARY KEY,\n    name\
    \ VARCHAR(100) NOT NULL,\n    email VARCHAR(100) UNIQUE NOT NULL\n);\n\nCREATE\
    \ TABLE Orders (\n    order_id SERIAL PRIMARY KEY,\n    customer_id INT NOT NULL,\n\
    \    order_date TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    total_amount DECIMAL(10,2),\n\
    \    FOREIGN KEY (customer_id) REFERENCES Customers(customer_id)\n);\n\nCREATE\
    \ TABLE Order_Items (\n    order_item_id SERIAL PRIMARY KEY,\n    order_id INT\
    \ NOT NULL,\n    product_id INT NOT NULL,\n    quantity INT NOT NULL CHECK (quantity\
    \ > 0),\n    FOREIGN KEY (order_id) REFERENCES Orders(order_id)\n);"
- type: bullets
  title: Example 1.9 — Hierarchical Scientific Arrays in HDF5
  bullets:
  - Example 1.9 — hands-on module
  - Example 1.9 demonstrates scientific array storage using the Hierarchical Data
    Format
  - HDF5 organizes complex multidimensional numeric arrays into tree-like group hierarchies
  - It supports chunked storage and native compression for high-dimensional scientific
    tensors
  - 'View files: `modules/chapter1/example9/`'
  notes: Example 1.9 demonstrates scientific array storage using the Hierarchical
    Data Format version 5. HDF5 organizes complex multidimensional numeric arrays
    into tree-like group hierarchies. It supports chunked storage and native compression
    for high-dimensional scientific tensors. Pipelines in physics, climate modeling,
    and deep learning rely on HDF5 for rapid multi-dimensional slicing. You can run
    code to create and query an HDF5 archive in the example 9 module.
- type: code
  title: Example 1.9 — listing
  code: "import h5py\nimport numpy as np\n\nwith h5py.File(\"example.h5\", \"w\")\
    \ as hdf:\n    data = np.random.rand(100, 100)\n    hdf.create_dataset(\"random_data\"\
    , data=data)\n    group = hdf.create_group(\"experiment\")\n    group.create_dataset(\"\
    temperature\", data=np.linspace(0, 100, 100))\n    group.create_dataset(\"pressure\"\
    , data=np.linspace(1, 10, 100))\n\nwith h5py.File(\"example.h5\", \"r\") as hdf:\n\
    \    print(\"Datasets in root:\", list(hdf.keys()))\n    random_data = hdf[\"\
    random_data\"][:]\n    print(\"Shape of 'random_data':\", random_data.shape)"
- type: bullets
  title: 'Multi-Format Trade-Off Matrix: Parquet, CSV, and SQLite'
  bullets:
  - Engineering teams must select formats based on access patterns and scale
  - Plain text CSV remains universally portable for small diagnostic exports despite
    slow
  - Relational SQLite provides zero-configuration local transactions and indexed queries
    for
  - Apache Parquet represents the industry standard for analytical data lakes
  - Specialized scientific formats like HDF5 and Zarr remain optimal for high-dimensional
  notes: Engineering teams must select formats based on access patterns and scale.
    Plain text CSV remains universally portable for small diagnostic exports despite
    slow parsing. Relational SQLite provides zero-configuration local transactions
    and indexed queries for mobile and embedded applications. Apache Parquet represents
    the industry standard for analytical data lakes, maximizing compression and query
    speed. Specialized scientific formats like HDF5 and Zarr remain optimal for high-dimensional
    numeric arrays.
