  notes: Choosing a storage format is an architectural decision that governs system
    performance. A format mismatch imposes severe computational and financial penalties
    across data pipelines. Storing hundreds of millions of transaction records in
    uncompressed CSV wastes massive storage and bandwidth parsing text delimiters
    into binary numbers. Columnar and binary serializations eliminate parsing overhead
    by storing values in native binary representations.
- type: bullets
  title: 'Row Stores versus Columnar Stores: Mechanical Sympathy'
  bullets:
  - Modern NVMe solid-state storage reads data in fixed physical four-kilobyte pages
  - Row-oriented layouts group all fields of an individual record contiguously on
    physical
  - Row layouts excel at transactional point lookups where single full records are
    modified
  - Columnar stores like Apache Parquet layout all values of a single column contiguously
  - When computing aggregations over selected columns
  notes: Modern NVMe solid-state storage reads data in fixed physical four-kilobyte
    pages. Row-oriented layouts group all fields of an individual record contiguously
    on physical disk pages. Row layouts excel at transactional point lookups where
    single full records are modified. Columnar stores like Apache Parquet layout all
    values of a single column contiguously. When computing aggregations over selected
    columns, columnar engines load only target attributes, bypassing discarded fields
    entirely.
