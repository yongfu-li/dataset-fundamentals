- type: bullets
  title: Key Takeaways and Architectural Trade-offs
  bullets:
  - To summarize our taxonomy of datasets, remember four architectural principles
  - Structural organization and temporal dynamics are orthogonal design decisions
  - Structured tabular relations guarantee atomic integrity and optimal query performance
  - Semi-structured trees enable flexible schema evolution at the cost of parsing
    overhead
  - Dynamic streams require event-time watermarking to guarantee accurate windowed
    analytics
  notes: To summarize our taxonomy of datasets, remember four architectural principles.
    Structural organization and temporal dynamics are orthogonal design decisions.
    Structured tabular relations guarantee atomic integrity and optimal query performance.
    Semi-structured trees enable flexible schema evolution at the cost of parsing
    overhead. Dynamic streams require event-time watermarking to guarantee accurate
    windowed analytics.
