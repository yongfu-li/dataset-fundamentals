  notes: Example 1.7 demonstrates semi-structured data using an e-commerce order payload
    formatted in JSON. The record combines rigid relational keys such as order identifier
    and customer identifier with flexible product lists and free-text customer reviews.
    This hybrid architecture shows how modern web applications store complex transactions
    without rigid multi-table joins. You can inspect and modify this payload in the
    example 7 module.
