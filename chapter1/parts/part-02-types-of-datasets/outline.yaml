title: Chapter 1 — Types of Datasets
footer: Chapter 1 — Types Of Datasets
slides:
- type: title
  title: Chapter 1 — Types of Datasets
  subtitle: Welcome to Part 2 of Chapter 1
  notes: Welcome to Part 2 of Chapter 1. Having defined records and attributes, we
    now establish how datasets are systematically classified. We examine structural
    taxonomies and temporal dynamics that govern data storage, query efficiency, and
    machine learning pipelines.
- type: bullets
  title: Learning Objectives
  bullets:
  - Normal form. We examine temporal dynamics
  - We analyze the late arrival problem with event-time watermarks and simulate streaming
  notes: Four primary learning goals guide this part. We classify datasets across
    the structural dimension into structured, semi-structured, and unstructured archetypes.
    We formalize relational tables mathematically through attribute domains and first
    normal form. We examine temporal dynamics, contrasting static historical snapshots
    with dynamic streaming event queues. Finally, we analyze the late arrival problem
    with event-time watermarks and simulate streaming windows in our interactive workbench.
- type: bullets
  title: The Two Fundamental Classification Axes
  bullets:
  - Every dataset encountered in data science is categorized across two orthogonal
    dimensions
  - The structural dimension evaluates how rigidly data conforms to a predefined schema
  - The temporal dimension governs how observations evolve over physical time
  - Selecting an organizational archetype dictates ingestion throughput and downstream
    storage
  - Structural organization directly influences how vulnerable a dataset is to schema
    drift
  notes: Every dataset encountered in data science is categorized across two orthogonal
    dimensions. The structural dimension evaluates how rigidly data conforms to a
    predefined schema. The temporal dimension governs how observations evolve over
    physical time. Selecting an organizational archetype dictates ingestion throughput
    and downstream storage footprints. Structural organization directly influences
    how vulnerable a dataset is to schema drift and covariate shift.
- type: bullets
  title: Mathematical Formalization of Structured Relations
  bullets:
  - A structured dataset is defined as an empirical relation over a fixed schema signature
  - Each attribute draws values strictly from a defined algebraic state domain
  - Structured relations satisfy relational invariance through strict column type
    homogeneity
  - Every relation adheres to first normal form
  - Tabular structured datasets are optimized for analytical aggregations and relational
    join
  notes: A structured dataset is defined as an empirical relation over a fixed schema
    signature. Each attribute draws values strictly from a defined algebraic state
    domain. Structured relations satisfy relational invariance through strict column
    type homogeneity. Every relation adheres to first normal form, ensuring all attribute
    cells contain atomic values rather than unindexed arrays. Tabular structured datasets
    are optimized for analytical aggregations and relational join operations.
