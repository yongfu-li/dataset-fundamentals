  notes: Exploratory Data Analysis rejects the naive assumption that datasets arrive
    ready for formal mathematical modeling. First formalized by John Tukey, exploratory
    analysis is the forensic investigation of empirical records. Machine learning
    algorithms naively exploit collection artifacts such as default null placeholders
    or sensor drift as predictive signals. Rigorous exploratory analysis uncovers
    latent anomalies and structural biases before defining loss functions.
