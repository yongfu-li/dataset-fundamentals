  - Spearman rank correlation calculates Pearson correlation over ordinal ranks
  - Comparing both metrics reveals non-linear dependencies and protects against spurious
  notes: The fourth tier investigates pairwise relationships across attribute dimensions.
    Pearson correlation quantifies linear relationships between continuous features
    but is sensitive to extreme outliers. Spearman rank correlation calculates Pearson
    correlation over ordinal ranks, capturing monotonic non-linear associations. Comparing
    both metrics reveals non-linear dependencies and protects against spurious linear
    assumptions.
- type: bullets
  title: 'The Pathological Pitfall: Simpson''s Paradox'
  bullets:
  - During correlation analysis, analysts must guard against Simpson's paradox
  - In this counter-intuitive statistical phenomenon
  - The reversal occurs when an unobserved confounding variable influences both feature
  - Rigorous exploratory subgroup profiling exposes confounding factors early
  notes: |-
    Dr. Nova: During correlation analysis, analysts must guard against Simpson's paradox, where aggregate correlations completely invert upon disaggregation.
    Kaito: Wait, how can Treatment A be superior overall, but perform worse than Treatment B in both young and elderly subgroups?
    Dr. Nova: Because of an unobserved confounding variable, Kaito! In severe illness cohorts, doctors assigned the experimental drug much more frequently. The overall aggregate masked patient severity. Rigorous exploratory subgroup profiling exposes confounding factors before training models.
