  notes: Example 1.20 walks through exploratory profiling on an empirical household
    income dataset. Incomes exhibit heavy right-skew, where a small cohort of high
    earners pulls the mean far above the median. Profiling the raw table reveals how
    extreme values distort naive parametric summaries. You can inspect the dataset
    and run diagnostic profiling scripts in the example 20 module.
- type: code
  title: Example 1.20 — listing
  code: 'import pandas as pd

    import matplotlib.pyplot as plt


    # Load the dataset

    household_incomes = pd.read_csv("household_incomes.csv")


    # View the first few rows

    print(household_incomes.head())


    # Summary statistics for numerical columns

    print(household_incomes.describe())


    # Check for missing values

    print(household_incomes.isnull().sum())


    # Visualize the income distribution

    household_incomes["Income"].hist()

    plt.title("Distribution of Household Incomes")

    plt.xlabel("Income")

    plt.ylabel("Frequency")

    plt.show()'
- type: bullets
  title: Transforming Right-Skewed Empirical Distributions
  bullets:
  - When continuous attributes display heavy positive skewness
  - Compressing extreme values stabilizes gradient descent during neural network training
  - Variance-stabilizing transformations prevent high-magnitude features from dominating
  notes: When continuous attributes display heavy positive skewness, applying a logarithmic
    transformation restores approximate symmetry. Compressing extreme values stabilizes
    gradient descent during neural network training. Variance-stabilizing transformations
    prevent high-magnitude features from dominating Euclidean distance calculations
    in clustering and nearest-neighbor algorithms.
