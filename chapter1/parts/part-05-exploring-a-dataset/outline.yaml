  notes: Rather than relying on Gaussian assumptions, robust exploration uses Tukey's
    non-parametric fences. Interquartile range is computed as the difference between
    the seventy-fifth and twenty-fifth percentiles. Inner fences set boundaries at
    one point five times the interquartile range beyond the quartiles. Outer fences
    extend three times the interquartile range to flag extreme anomalies. Outliers
    transcending the outer fence warrant individual provenance investigation.
- type: bullets
  title: 'Tier 4: Bivariate Associations: Pearson versus Spearman'
  bullets:
