  notes: The first tier of diagnostic profiling audits fundamental shape and memory
    invariants. Data scientists calculate sample volume N, attribute count M, and
    overall matrix sparsity. Analysts verify that memory footprints align with workstation
    constraints. Crucially, inspectors separate physical storage types from semantic
    measurement domains, identifying categorical identifiers stored as numeric values.
- type: bullets
  title: 'Tier 2: Distributional Moments, Skewness, and Kurtosis'
  bullets:
  - The second tier evaluates the first four statistical moments for every continuous
    feature
  - Mean and variance measure central location and scale
  - Skewness quantifies distributional asymmetry
  - Kurtosis measures tail heaviness and extreme event risk
  - Recognizing skewness dictates when practitioners must apply non-parametric methods
    or
  notes: The second tier evaluates the first four statistical moments for every continuous
    feature. Mean and variance measure central location and scale. Skewness quantifies
    distributional asymmetry, where severe positive right-skew causes sample means
    to diverge from medians. Kurtosis measures tail heaviness and extreme event risk.
    Recognizing skewness dictates when practitioners must apply non-parametric methods
    or logarithmic transformations.
