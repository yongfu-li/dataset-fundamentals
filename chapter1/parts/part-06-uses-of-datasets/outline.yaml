  notes: Four principles summarize the applied use of datasets in machine learning
    systems. Datasets exist to power closed-loop decision making and empirical risk
    minimization. Real-world applications demand error metrics aligned with asymmetric
    business and clinical costs. Rigid train, validation, and test partitioning prevents
    catastrophic data leakage. Operational decision thresholds must be optimized against
    net economic utility rather than naive default cutoffs.
