  - Causing models to memorize individuals
  - Exact duplicate record leakage artificially inflates evaluation metrics while
    failing on
  notes: Data leakage occurs when target or future information inadvertently contaminates
    model features. Temporal lookahead leakage occurs when global feature statistics
    are computed across both training and test horizons. Entity contamination leakage
    occurs when observations from the same patient or user appear in both splits,
    causing models to memorize individuals. Exact duplicate record leakage artificially
    inflates evaluation metrics while failing on unseen data.
