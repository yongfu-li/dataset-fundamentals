  notes: Subscription churn prediction represents a classic enterprise modeling lifecycle.
    Behavioral features such as tenure, complaint frequency, and activity trends predict
    the probability of customer cancellation. However, setting the decision threshold
    to point five is rarely optimal. The optimal economic threshold balances true
    positive retention gains against the operational cost of marketing outreach.
