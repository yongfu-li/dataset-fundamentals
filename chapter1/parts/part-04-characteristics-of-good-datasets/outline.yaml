  - Metadata sidecars adhering to FAIR principles ensure long-term scientific reproducibility
  notes: Four fundamental principles summarize our study of dataset quality. Quality
    is multi-dimensional and must be evaluated relative to specific analytical tasks.
    Detecting semantic accuracy errors requires statistical distribution auditing
    beyond simple typing checks. Addressing missing values requires identifying whether
    data is missing completely at random or not at random. Metadata sidecars adhering
    to FAIR principles ensure long-term scientific reproducibility.
