- type: title
  title: Chapter 1 — Characteristics of Good Datasets
  subtitle: Welcome to Part 4 of Chapter 1
  notes: Welcome to Part 4 of Chapter 1. Having surveyed dataset storage formats,
    we now examine what makes a dataset fit for production machine learning and rigorous
    science. We study multi-dimensional quality frameworks, defect typologies, missingness
    mechanisms, and metadata engineering.
- type: bullets
  title: Learning Objectives
  bullets:
  - Four primary objectives anchor our study of data quality
  - We define the five core dimensions of accuracy, completeness, consistency, timeliness
  - We diagnose semantic accuracy defects and categorize missingness mechanisms into
    MCAR, MAR
  - We examine metadata architectures adhering to the FAIR data principles
  - Finally, we audit dataset health scores using our in-browser diagnostic inspector
  notes: Four primary objectives anchor our study of data quality. We define the five
    core dimensions of accuracy, completeness, consistency, timeliness, and relevance.
    We diagnose semantic accuracy defects and categorize missingness mechanisms into
    MCAR, MAR, and MNAR. We examine metadata architectures adhering to the FAIR data
    principles. Finally, we audit dataset health scores using our in-browser diagnostic
    inspector.
- type: bullets
  title: The Multi-Dimensional Quality Framework
  bullets:
  - Data quality is not a single scalar metric
  - A dataset can be completely populated while being factually inaccurate
  - Following foundational data quality ontologies
  - Accuracy measures ground truth fidelity
  - Completeness measures attribute coverage and sparsity
  - Consistency checks invariant rules
  notes: Data quality is not a single scalar metric. A dataset can be completely populated
    while being factually inaccurate, or mathematically precise while completely obsolete.
    Following foundational data quality ontologies, we evaluate fitness across five
    primary dimensions. Accuracy measures ground truth fidelity. Completeness measures
    attribute coverage and sparsity. Consistency checks invariant rules. Timeliness
    measures temporal currency, and relevance quantifies predictive mutual information
    with target tasks.
