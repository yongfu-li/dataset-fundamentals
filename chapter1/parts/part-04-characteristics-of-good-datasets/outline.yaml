  title: In-Browser Data Quality Health Inspector
  bullets:
  - Learners can evaluate dataset health interactively using our in-browser Data Quality
  - The workbench computes a composite quality index across accuracy, completeness
  - You can toggle between clean datasets and corrupted samples containing MCAR and
    MNAR
  - Observing how individual defects degrade the composite health score sharpens diagnostic
  notes: Learners can evaluate dataset health interactively using our in-browser Data
    Quality Inspector. The workbench computes a composite quality index across accuracy,
    completeness, and consistency metrics. You can toggle between clean datasets and
    corrupted samples containing MCAR and MNAR patterns. Observing how individual
    defects degrade the composite health score sharpens diagnostic instincts for production
    auditing.
