  notes: Example 1.14 demonstrates production metadata engineering using a JSON sidecar
    file. The metadata file specifies geographic coordinate datums, physical sensor
    models, temperature measurement units, and temporal sampling intervals. Storing
    explicit metadata alongside raw readings ensures downstream models correctly interpret
    physical dimensions. You can explore the complete JSON-LD schema in the example
