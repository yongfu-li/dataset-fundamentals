  notes: Each quality dimension can be formalized mathematically. Accuracy is computed
    as the proportion of recorded values falling within an acceptable tolerance of
    physical ground truth. Completeness measures the ratio of non-null, valid cells
    across the observation matrix. Consistency calculates the fraction of records
    satisfying all referential integrity and format constraints. Timeliness models
    freshness using exponential temporal decay functions from observation to query
    time.
- type: bullets
  title: The Semantic Accuracy Catastrophe
  bullets:
  - Syntactically valid values can still cause severe analytical catastrophes
  - The sample mean shifts dramatically
  - Because the corrupted number remains a valid positive float
  - Catching semantic inaccuracy requires distribution auditing, Mahalanobis distance
    checks
  notes: Syntactically valid values can still cause severe analytical catastrophes.
    If a transaction ledger accidentally records fifteen thousand dollars instead
    of fifteen hundred dollars, the sample mean shifts dramatically. Because the corrupted
    number remains a valid positive float, naive schema validators cannot detect the
    error. Catching semantic inaccuracy requires distribution auditing, Mahalanobis
    distance checks, and interquartile range outlier fencing.
- type: bullets
  title: 'Missingness Mechanisms: MCAR, MAR, and MNAR'
  bullets:
  - When attributes contain missing cells
  - Missing completely at random occurs when data drops due to transient
  - Missing at random occurs when missingness depends on observed features
  - Missing not at random occurs when the missing value itself dictates its absence
  - Imputing without understanding these mechanisms introduces severe statistical
    bias
  notes: When attributes contain missing cells, engineers must diagnose the underlying
    missingness mechanism before imputing values. Missing completely at random occurs
    when data drops due to transient, uncorrelated hardware faults. Missing at random
    occurs when missingness depends on observed features, such as optional profile
    fields. Missing not at random occurs when the missing value itself dictates its
    absence, such as high earners concealing income. Imputing without understanding
    these mechanisms introduces severe statistical bias.
