  notes: Consistency failures frequently emerge from format collisions and violated
    relational invariants. Date format ambiguities represent a classic failure mode
    when combining American and international records. Storing dates without ISO eight-six-zero-one
    standards causes sorting algorithms to misplace events by thirty days. This temporal
    disordering leaks future records into training sets, corrupting time-series cross-validation.
    Enforcing strict schema invariants at ingestion prevents downstream leakage.
